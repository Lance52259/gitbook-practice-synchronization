name: monitor-and-generate

on:
  schedule:
    # 东八区每天凌晨 02:00（UTC 18:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      practice:
        description: "Optional practice_id (e.g. examples/foo)"
        required: false
        default: ""
      dry_run:
        description: "Dry run without push/PR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  craft:
    runs-on: ubuntu-latest
    # Secrets 配置在 Settings → Environments → Development 时必须声明
    environment: Development
    steps:
      - name: Checkout gitbook-practice-synchronization
        uses: actions/checkout@v4

      - name: Run gitbook-practice-synchronization
        uses: ./.github/actions/gitbook-practice-synchronization-action
        with:
          mode: run
          practice: ${{ inputs.practice || '' }}
          dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
        env:
          # B / C 仓必填，无工作流内置默认值
          B_REPO: ${{ secrets.B_REPO }}
          B_REPO_TOKEN: ${{ secrets.B_REPO_TOKEN }}
          B_DEFAULT_BRANCH: ${{ vars.B_DEFAULT_BRANCH || 'master' }}
          C_REPO: ${{ secrets.C_REPO }}
          C_REPO_TOKEN: ${{ secrets.C_REPO_TOKEN }}
          C_DEFAULT_BRANCH: ${{ vars.C_DEFAULT_BRANCH || 'master' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '300000' }}
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS || '300' }}
          SKILL_ID: ${{ vars.SKILL_ID || 'best-practice-doc' }}
          # 单次最多处理条数；Environment Variable / Repo Variable 均可；0=不限制
          MAX_PRACTICES: ${{ vars.MAX_PRACTICES || '1' }}

      - name: Upload AI failure dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failures
          path: .work/ai-failures/
          if-no-files-found: ignore
          retention-days: 14
